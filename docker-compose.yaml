version: '3.9'
name: 'true_code'
services:
  postgres:
    image: docker.art.ladadigit.io/postgres:16.4-alpine3.20
    container_name: true_code_db
    restart: unless-stopped
    shm_size: 256m
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
